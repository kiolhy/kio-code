name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 先做最便宜的检查：语法、JSON、License。挂了后面的 job 不用白跑。
  lint:
    name: 语法 / JSON / License
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 显示环境
        run: |
          node --version
          npm --version 2>/dev/null || true

      - name: 所有 .mjs 语法检查
        run: |
          set -e
          files=$(git ls-files '*.mjs')
          echo "$files" | wc -l
          for f in $files; do node --check "$f"; done
          echo "语法检查通过"

      - name: 所有 .json 可解析
        run: |
          set -e
          for f in $(git ls-files '*.json'); do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
          done
          echo "JSON 检查通过"

      - name: License 一致性（LICENSE 与 package.json）
        run: |
          set -e
          grep -q "MIT License" LICENSE
          node -e "
            const pkg = require('./package.json');
            if (pkg.license !== 'MIT') { throw new Error('package.json license 不是 MIT: ' + pkg.license); }
            console.log('license =', pkg.license, '| author =', pkg.author);
          "

  # 主测试：起网关跑全量套件（含出站指纹与网关端到端）
  test:
    name: 测试 (Node ${{ matrix.node }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 显示环境
        run: |
          node --version
          npm --version 2>/dev/null || true

      - name: 准备 CI 配置（关闭 443 捕获，CI 里无法绑定特权端口）
        run: |
          mkdir -p data
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('config.json', 'utf8'));
            c.capture = { ...(c.capture || {}), enabled: false };
            fs.writeFileSync('config.ci.json', JSON.stringify(c, null, 2));
            console.log('capture.enabled =', c.capture.enabled);
          "

      - name: 启动网关
        run: |
          MOCK_HUB_CONFIG=config.ci.json MOCK_HUB_DATA=data/ci node server.mjs > data/server.log 2>&1 &
          echo $! > .server.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/health > /dev/null 2>&1; then
              echo "网关已就绪（第 $i 次探测）"
              curl -s http://127.0.0.1:8787/health
              exit 0
            fi
            sleep 0.25
          done
          echo "网关启动失败，日志："
          cat data/server.log
          cat data/server.err.log 2>/dev/null || true
          exit 1

      - name: 全量测试（自检 / 工具 / 重放 / 批量 / 控制台 / 指纹 / 网关）
        run: npm test

      - name: 收集日志
        if: always()
        run: |
          echo '--- data/server.log ---'
          cat data/server.log 2>/dev/null || true
          echo '--- data/server.err.log ---'
          cat data/server.err.log 2>/dev/null || true

      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-node${{ matrix.node }}
          path: |
            data/server.log
            data/server.err.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 停止网关
        if: always()
        run: |
          if [ -f .server.pid ]; then kill "$(cat .server.pid)" 2>/dev/null || true; fi

  # 镜像必须能独立跑起来：曾经漏拷 lib/ 导致容器内 import 直接失败
  docker:
    name: 镜像构建 + 冒烟
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t kio-code-gateway:ci .

      - name: 启动容器
        run: |
          docker run -d --name gw-ci \
            -e MOCK_HUB_MODE=mock \
            -e MOCK_HUB_DATA=/app/data \
            -p 18787:8787 \
            kio-code-gateway:ci
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:18787/health; then echo; echo "容器已就绪"; exit 0; fi
            sleep 0.5
          done
          echo "容器没起来："
          docker logs gw-ci || true
          exit 1

      - name: 镜像内部自检（lib / 指纹 / 文档）
        run: |
          set -e
          docker exec gw-ci node -e "import('/app/lib/gateway.mjs').then(()=>console.log('gateway.mjs ok'))"
          docker exec gw-ci node -e "import('/app/lib/stealth.mjs').then(m=>console.log('UA =', m.resolveProfile({}).userAgent))"
          docker exec gw-ci node -e "const fs=require('fs');for(const f of ['/app/LICENSE','/app/docs/stealth.md','/app/lib/transport.mjs','/app/lib/pacing.mjs']) fs.accessSync(f);console.log('files ok')"
          docker exec gw-ci node tools/test-stealth.mjs
          echo "镜像自检通过"

      - name: 收尾
        if: always()
        run: |
          docker logs gw-ci 2>/dev/null || true
          docker rm -f gw-ci 2>/dev/null || true

  # 443 捕获需要绑定特权端口与自签证书（make-cert.ps1 仅 Windows），单独跑在 Windows 上
  capture:
    name: 443 捕获 (Windows)
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 生成自签证书
        shell: pwsh
        run: ./tools/make-cert.ps1

      # 起服务 / 等待 / 跑测试 / 收尾必须在同一步里：
      # GitHub 的 Windows runner 会在步骤结束时回收子进程，跨步骤留下的 node 会消失，
      # 下一步就变成 ECONNREFUSED 127.0.0.1:8443（历史失败原因）。
      - name: 起网关 → 捕获链路测试 → 收尾
        shell: pwsh
        env:
          CAP_PORT: '8443'
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path data | Out-Null
          # 绑 0.0.0.0、连 127.0.0.1：Windows runner 上只绑回环偶发不接受连接
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('config.json', 'utf8'));
            c.capture = { ...(c.capture || {}), enabled: true, host: '0.0.0.0', port: 8443 };
            fs.writeFileSync('config.capture-ci.json', JSON.stringify(c, null, 2));
            console.log('capture:', JSON.stringify(c.capture));
          "
          $env:MOCK_HUB_CONFIG = 'config.capture-ci.json'
          $env:MOCK_HUB_DATA = 'data/ci'
          $proc = Start-Process node -ArgumentList 'server.mjs' -WorkingDirectory $PWD -PassThru `
            -RedirectStandardOutput data/server.log -RedirectStandardError data/server.err.log

          function Wait-Tcp([int]$Port, [int]$TimeoutSec = 25) {
            $deadline = (Get-Date).AddSeconds($TimeoutSec)
            while ((Get-Date) -lt $deadline) {
              $client = New-Object Net.Sockets.TcpClient
              try {
                $client.Connect('127.0.0.1', $Port)
                if ($client.Connected) { return $true }
              } catch {
                Start-Sleep -Milliseconds 200
              } finally {
                $client.Dispose()
              }
            }
            return $false
          }

          $httpUp = $false
          for ($i = 0; $i -lt 80; $i++) {
            try {
              if ((Invoke-WebRequest 'http://127.0.0.1:8787/health' -TimeoutSec 1 -UseBasicParsing).StatusCode -eq 200) {
                $httpUp = $true; break
              }
            } catch {}
            Start-Sleep -Milliseconds 250
          }
          $tcpUp = Wait-Tcp -Port 8443 -TimeoutSec 25

          $code = 1
          try {
            if (-not $httpUp) {
              Write-Host '::error::8787 未就绪'
            } elseif (-not $tcpUp) {
              Write-Host '::error::8443 未监听（捕获服务没起来）'
            } else {
              $out = (node tools/test-capture.mjs 2>&1 | Out-String)
              Write-Host $out
              $code = $LASTEXITCODE
              if ($code -ne 0) {
                $tail = (($out -split "`r?`n") | Where-Object { $_ -match '✗|Error|error|ECONN|EADDR|Cannot' } | Select-Object -First 4) -join ' || '
                if (-not $tail) { $tail = (($out -split "`r?`n") | Select-Object -Last 4) -join ' || ' }
                $slog = Get-Content 'data/server.log' -Raw -ErrorAction SilentlyContinue
                $elog = Get-Content 'data/server.err.log' -Raw -ErrorAction SilentlyContinue
                $snip = { param($t) if ($t) { ($t -replace "`r?`n", ' | ').Substring(0, [Math]::Min(500, $t.Length)) } else { '(空)' } }
                Write-Host "::error::test-capture 失败：$tail ~~~ server.log: $(& $snip $slog) ~~~ server.err: $(& $snip $elog)"
              }
            }

            if ($code -ne 0) {
              Write-Host '--- 诊断 ---'
              Write-Host ("进程存活: " + ($proc -and -not $proc.HasExited))
              Get-NetTCPConnection -LocalPort 8443, 8787 -ErrorAction SilentlyContinue |
                Select-Object LocalAddress, LocalPort, State | Format-Table -AutoSize | Out-String | Write-Host
              Write-Host '--- server.log ---'
              Get-Content data/server.log -ErrorAction SilentlyContinue | Select-Object -Last 40
              Write-Host '--- server.err.log ---'
              Get-Content data/server.err.log -ErrorAction SilentlyContinue | Select-Object -Last 20
            }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
          exit $code

      - name: 收集日志
        if: always()
        shell: pwsh
        run: |
          Get-Content data/server.log -ErrorAction SilentlyContinue
          Get-Content data/server.err.log -ErrorAction SilentlyContinue
